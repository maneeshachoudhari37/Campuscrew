<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusShare - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

<div class="login-container">

    <div class="login-brand">
        <div class="logo">CS</div>
        <h1>CampusShare</h1>
        <p>Unlocking Hidden Campus Resources</p>
    </div>

    <div class="login-card">

        <h2>Welcome Back 👋</h2>
        <p class="login-subtitle">
            Access and share your campus resources
        </p>

        <label>College ID</label>
        <input type="text" id="collegeId" placeholder="Enter College ID">

        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password">

        <label>Login As</label>
        <select id="role">
            <option value="student">Student</option>
            <option value="admin">Admin</option>
        </select>

        <button class="primary-btn" onclick="login()">
            Login
        </button>

        <p id="loginMessage" class="message"></p>

        <div class="demo-login">
            <strong>Demo Login</strong>
            <p>Student: student / 1234</p>
            <p>Admin: admin / admin123</p>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
